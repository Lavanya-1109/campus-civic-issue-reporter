<main id="feed-mount" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 flex flex-col gap-6">
<div class="flex items-center justify-center gap-2 py-24 text-on-surface-variant text-body-sm font-body-sm">
<span class="material-symbols-outlined text-[20px] animate-spin">progress_activity</span>
