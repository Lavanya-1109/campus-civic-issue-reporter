<!-- Pulls the feed/form/submission markup live from reports/code.html so
     this page doesn't carry its own duplicate copy of it. -->
<script>
    document.addEventListener('DOMContentLoaded', async () => {
      const mount = document.getElementById('feed-mount');
      try {
        const res = await fetch('../reports/reports.html');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const html = await res.text();
        const sourceMain = new DOMParser().parseFromString(html, 'text/html').querySelector('main');
        if (!sourceMain) throw new Error('No <main> found in reports/code.html');
        sourceMain.id = 'feed-mount';
        mount.replaceWith(sourceMain);

        // This page is the Super Admin entry point, so it always applies
        // the super_admin role — it doesn't read the shared dev-role-switcher
        // value like the generic dashboard does.
        // TODO: replace with the real role from your auth/session.
        applyRole('super_admin');
        restoreLocalOverrides();
      } catch (err) {
        console.error('Failed to load reports fragment:', err);
        mount.innerHTML = '<div class="text-center py-24">' +
          '<p class="text-body-sm font-body-sm text-error mb-2">Couldn\'t load reports right now.</p>' +
          '<a class="text-label-md font-label-md text-secondary hover:underline" href="../reports/code.html">Open Reports directly →</a>' +
          '</div>';
      }
    });
  </script>
